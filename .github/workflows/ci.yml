# Linux only: the maintainer, 2026-10-28, "No ci on mac"; macOS is checked locally on thresher.
# Nothing here may preclude Windows (contract §12); a Windows job is not run yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # 3.11 is the floor the model venvs need; 3.13 is current. Two runs in one job, not a matrix.
      # The cross-language suite builds rust/ck-conform; it runs in the conformance job instead.
      - name: pytest (3.11)
        run: uv run --python 3.11 --extra dev pytest -q --ignore=tests/test_conformance.py
      - name: pytest (3.13)
        run: uv run --python 3.13 --extra dev pytest -q --ignore=tests/test_conformance.py
      - name: ruff
        run: uv run --python 3.13 --extra dev ruff check .
      - name: uv build leaves rust/ out
        run: |
          uv build --out-dir dist-ci
          # Not `! cmd`: bash -e ignores a negated command, so only the last line would count.
          if tar -tzf dist-ci/*.tar.gz | grep -q '/rust/'; then exit 1; fi
          if unzip -Z1 dist-ci/*.whl | grep -q '^rust/'; then exit 1; fi

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features
      - name: cargo package includes LICENSE and README, and leaves out tests/
        run: |
          cargo package --list -p commonkit > "$RUNNER_TEMP/package-list.txt"
          grep -qx LICENSE "$RUNNER_TEMP/package-list.txt"
          grep -qx README.md "$RUNNER_TEMP/package-list.txt"
          if grep -q '^tests/' "$RUNNER_TEMP/package-list.txt"; then exit 1; fi
      # Builds the crate from its packaged files alone, as crates.io will.
      - run: cargo package -p commonkit
      # docs.rs builds these on publish; a broken intra-doc link fails here first.
      - run: cargo doc -p commonkit --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # The stated rust-version (1.95). Inference changes after it once broke the test build
    # (tests/hostile_input.rs, 2026-10-28), so build and test on it, not only on stable.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test -p commonkit
      - run: cargo test -p commonkit --no-default-features

  conformance:
    # Plan step 8: the Rust tests that read conformance/vectors/, then the cross-language suite,
    # which runs the Python package and the Rust crate on one tree through their drivers
    # (conformance/ck_conform.py and rust/ck-conform) in both directions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: vectors (Rust)
        working-directory: rust
        run: cargo test -p commonkit --test 'vectors*'
      - name: cross-language (pytest drives both drivers)
        run: uv run --python 3.11 --extra dev pytest -q tests/test_conformance.py tests/test_dry_run.py
      - name: cross-language (Rust drives Python)
        working-directory: rust
        env:
          # Fail, rather than skip, if uv were missing here.
          CK_CONFORM_REQUIRE_PYTHON: "1"
        run: cargo test -p ck-conform
