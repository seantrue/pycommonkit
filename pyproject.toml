[project]
name = "pyuncommonkit"
version = "0.2.0"
description = "Named shared-memory segments for numpy arrays: publish once, attach from any process."
readme = "README.md"
authors = [
    { name = "Sean D. True", email = "sean.true@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
# 3.11, NOT 3.12: the model venvs this exists to serve are python 3.11, and
# being importable there is the whole point of the package.
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # The hashing facade's BLAKE3 (commonkit.digest), the one exception to "numpy only"
    # (D6): a hard dependency, imported lazily on the first BLAKE3 digest, so the store and
    # anything that never hashes never loads it.
    "blake3>=1.0",
]
keywords = ["numpy", "npy", "mmap", "shared-memory", "cache"]
# No License :: classifier: PEP 639's `license` expression replaces it. Linux and macOS only:
# Windows has a default root since 0.1.1 and passes the suite on a Windows 11 machine, but has no
# CI yet, so no Windows classifier.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/seantrue/pycommonkit"
Repository = "https://github.com/seantrue/pycommonkit"
Issues = "https://github.com/seantrue/pycommonkit/issues"
Contract = "https://github.com/seantrue/pycommonkit/blob/main/docs/contract.md"
"Rust crate" = "https://crates.io/crates/commonkit"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Published as pyuncommonkit, imported as commonkit, so no consumer's code changes; only its
# dependency line does. PyPI `commonkit` belongs to an unrelated project, and PyPI refused
# `pycommonkit` as too similar to it (2026-10-28).
module-name = "commonkit"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The default rules, plus the hashing ban (D10): only the facade (src/commonkit/digest.py)
# and the second implementation that checks it (conformance/, tests/) may hash directly.
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"hashlib".msg = "hash through commonkit.digest (D19); fixed algorithms through digest.fixed"
"blake3".msg = "hash through commonkit.digest (D19)"

[tool.ruff.lint.per-file-ignores]
"src/commonkit/digest.py" = ["TID251"]
"conformance/*" = ["TID251"]
"tests/*" = ["TID251"]
