[project]
name = "pyuncommonkit"
version = "0.1.0"
description = "Named shared-memory segments for numpy arrays: publish once, attach from any process."
readme = "README.md"
authors = [
    { name = "Sean D. True", email = "sean.true@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
# 3.11, NOT 3.12: the model venvs this exists to serve are python 3.11, and
# being importable there is the whole point of the package.
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]
keywords = ["numpy", "npy", "mmap", "shared-memory", "cache"]
# No License :: classifier: PEP 639's `license` expression replaces it. Linux and macOS only:
# Windows is supported in the contract (§12) but has no Python default root or CI yet.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/seantrue/pycommonkit"
Repository = "https://github.com/seantrue/pycommonkit"
Issues = "https://github.com/seantrue/pycommonkit/issues"
Contract = "https://github.com/seantrue/pycommonkit/blob/main/docs/contract.md"
"Rust crate" = "https://crates.io/crates/commonkit"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Published as pyuncommonkit, imported as commonkit, so no consumer's code changes; only its
# dependency line does. PyPI `commonkit` belongs to an unrelated project, and PyPI refused
# `pycommonkit` as too similar to it (2026-10-28).
module-name = "commonkit"

[tool.ruff]
line-length = 100
